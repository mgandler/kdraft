[package]
name = "kdraft-ui"
description = "kdraft desktop editor (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "kdraft-gui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["glow"]
# OpenGL renderer (eframe's default): light, works on any Windows PC with a
# GPU driver.
glow = ["eframe/glow"]
# Alternative renderer (DirectX 12 / Vulkan, with WARP software fallback on
# Windows): for remote desktops or VMs without OpenGL 2+.
wgpu = ["eframe/wgpu"]

[dependencies]
kdraft-board.workspace = true
kdraft-doc.workspace = true
kdraft-engine.workspace = true
kdraft-render.workspace = true
kdraft-source.workspace = true
kdraft-plot.workspace = true
kdraft-sheet.workspace = true
kdraft-layout.workspace = true
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
serde_json.workspace = true
anyhow.workspace = true
blake3.workspace = true
# Native file dialogs: Windows common dialogs (windows-sys, no setup);
# on Linux the XDG desktop portal over D-Bus (pure Rust, no GTK).
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false }
kdraft-plot = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tiny-skia.workspace = true
