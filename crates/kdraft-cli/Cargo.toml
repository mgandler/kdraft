[package]
name = "kdraft-cli"
description = "Headless kdraft command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "kdraft"
path = "src/main.rs"

[dependencies]
kdraft-sexpr.workspace = true
kdraft-board.workspace = true
kdraft-source.workspace = true
kdraft-doc.workspace = true
kdraft-sheet.workspace = true
kdraft-plot.workspace = true
kdraft-render.workspace = true
kdraft-engine.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kdraft-plot = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
